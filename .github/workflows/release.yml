name: Release Action & Update Major Tag

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup tools with Mise
        uses: jdx/mise-action@v2

      - name: Install dependencies & Build Bundle
        run: |
          pnpm install
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Commit build artifacts if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --staged --quiet; then
            echo "No dist changes to commit"
          else
            git commit -m "chore(release): update distribution bundle [skip ci]"
            git push
          fi

      - name: Update Floating Major Tag (v1)
        run: |
          git tag -f v1
          git push origin v1 --force
