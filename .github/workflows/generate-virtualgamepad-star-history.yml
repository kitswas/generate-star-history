name: Generate VirtualGamePad Star History

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  generate-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Generate VirtualGamePad Star History Comparison
        uses: ./
        with:
          github-token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          repository: 'kitswas/VirtualGamePad-PC, kitswas/VirtualGamePad, kitswas/VirtualGamePad-Mobile'
          output-path: 'assets/star-history-virtualgamepad.svg'
          theme: 'auto'

      - name: Commit and Push Updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history-virtualgamepad.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update virtualgamepad comparison star history chart [skip ci]"
            git push
          fi
