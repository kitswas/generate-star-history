name: "Generate Star History"
description: "Generates an animated, responsive SVG star history chart for single or multi-repository comparisons with zero external dependencies."
branding:
  icon: star
  color: white
inputs:
  github-token:
    description: "GitHub token for fetching star history (GITHUB_TOKEN for single repo, or a Personal Access Token (PAT) for multi-repo / cross-repository generation). Required due to API rate limit and authentication enforcement (see https://github.blog/changelog/2026-06-30-upcoming-access-restrictions-to-public-api-endpoints-and-ui-views/)."
    required: true
    default: ${{ github.token }}
  repository:
    description: 'Target repository ("owner/repo") or comma-separated list for multi-repo comparison (e.g. "owner/repo1, owner/repo2"). Defaults to current repository.'
    required: false
    default: ${{ github.repository }}
  output-path:
    description: "Workspace-relative file path where the generated SVG chart will be saved."
    required: false
    default: "assets/star-history.svg"
  theme:
    description: 'Chart styling mode: "auto" (CSS @media prefers-color-scheme reactive), "dark", or "light".'
    required: false
    default: "auto"
outputs:
  svg-path:
    description: "Workspace-relative path of the generated SVG chart (mirrors output-path input). Use with git add or actions/upload-artifact."
runs:
  using: "node24"
  main: "dist/index.js"
